<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123c69">
<title>CONNAISSANCES+ — Plateforme éducative</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--blue:#123c69;--blue2:#1d5d96;--light:#f2f6fb;--text:#203047;--green:#16845b;--red:#c0392b;--orange:#d35400}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:var(--text)}
header{background:var(--blue);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold;margin:3px}
.primary{background:var(--blue2);color:white}.success{background:var(--green);color:white}.danger{background:var(--red);color:white}.warning{background:var(--orange);color:white}
.login{max-width:440px;margin:60px auto;background:white;padding:30px;border-radius:14px;text-align:center;box-shadow:0 3px 15px #0001}
.layout{display:flex;min-height:calc(100vh - 60px)}
nav{width:245px;background:white;padding:12px;display:flex;flex-direction:column;gap:5px;border-right:1px solid #ddd}
nav button{text-align:left;background:white;color:var(--text);width:100%}
nav button.active,nav button:hover{background:#e7f0fa;color:var(--blue)}
main{flex:1;padding:22px;min-width:0;max-width:1250px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}
.card,.formbox,.item{background:white;padding:18px;border-radius:11px;margin:12px 0;box-shadow:0 2px 8px #0000000a}
.card{border-top:4px solid var(--blue2)}
.item{border-left:4px solid var(--blue2)}
input,select,textarea{width:100%;padding:11px;margin:6px 0 13px;border:1px solid #ccd5df;border-radius:7px;font:inherit}
textarea{min-height:110px}
label{font-weight:bold;font-size:14px}
.muted{color:#6d7887;font-size:14px}
.hidden{display:none!important}
#message{padding:12px;border-radius:8px;margin-bottom:14px;background:#e7f0fa}
.badge{display:inline-block;background:#e2e8f0;padding:4px 8px;border-radius:6px;font-size:12px}
.badge.publie{background:#d4edda;color:#155724}.badge.attente{background:#fff3cd;color:#856404}
table{width:100%;border-collapse:collapse;background:white;margin-top:12px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:13px}
th{background:var(--blue);color:white}
.table-container{overflow-x:auto}
.question{padding:14px;border:1px solid #ddd;border-radius:8px;margin:12px 0;background:white}
@media(max-width:760px){.layout{display:block}nav{width:100%;display:grid;grid-template-columns:repeat(2,1fr)}nav button{font-size:12px;padding:9px}main{padding:12px}}
</style>
</head>
<body>

<header>
  <h2>📚 CONNAISSANCES+</h2>
  <div>
    <span id="headerUser"></span>
    <button class="danger" onclick="logout()">Déconnexion</button>
  </div>
</header>

<section id="loginPanel" class="login">
  <h1>CONNAISSANCES+</h1>
  <h3>Le savoir ouvre toutes les portes.</h3>
  <p>Votre plateforme éducative haïtienne.</p>
  <button class="primary" style="width:100%" onclick="loginGoogle()">🚀 Continuer avec Google</button>
  <p id="loginMessage" class="muted"></p>
</section>

<section id="app" class="hidden">
<div class="layout">
<nav id="menu">
  <button class="active" onclick="showPage('accueil',this)">🏠 Accueil</button>
  <button onclick="showPage('niveaux',this)">🎓 Niveaux</button>
  <button onclick="showPage('matieres',this)">📘 Matières</button>
  <button onclick="showPage('cours',this)">📚 Cours</button>
  <button onclick="showPage('lecons',this)">📝 Leçons</button>
  <button onclick="showPage('exercices',this)">✍️ Exercices</button>
  <button onclick="showPage('examens',this)">📋 Examens et quiz</button>
  <button onclick="showPage('resultats',this)">📊 Résultats</button>
  <button onclick="showPage('progression',this)">📈 Progression</button>
  <button id="teacherMenu" class="hidden" onclick="showPage('enseignant',this)">👨‍🏫 Enseignant</button>
  <button id="adminMenu" class="hidden" onclick="showPage('administration',this)">⚙️ Administration</button>
</nav>
<main>
  <div id="message" class="hidden"></div>
  <div id="pageContent"></div>
</main>
</div>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
 getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,
 onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {
 getFirestore,doc,getDoc,setDoc,addDoc,collection,getDocs,
 updateDoc,deleteDoc,query,where,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAaF4sq1z27ZscLfMHo5GufkPxnu0-rbnA",
 authDomain:"konesans-plus.firebaseapp.com",
 projectId:"konesans-plus",
 storageBucket:"konesans-plus.firebasestorage.app",
 messagingSenderId:"374720398601",
 appId:"1:374720398601:web:ed9ffff17f25bff5b73fd8"
};

const ADMIN_EMAIL="simeonsadrack39@gmail.com";
const ADMIN_UID="DcJwjMmGqAOHqtzE9vYLxKAJeIJ3";
const AI_WORKER_URL="COLLE_URL_CLOUDFLARE_WORKER_LA_ISIT";

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getFirestore(appFirebase);
const provider=new GoogleAuthProvider();

let currentUser=null,currentProfile=null,isAdmin=false,isTeacher=false;
let editingId=null,editingCollection=null;

const niveaux=[
"1ère année fondamentale","2ème année fondamentale","3ème année fondamentale",
"4ème année fondamentale","5ème année fondamentale","6ème année fondamentale",
"7ème année fondamentale","8ème année fondamentale","9ème année fondamentale",
"Secondaire 1 / NS1","Secondaire 2 / NS2","Secondaire 3 / NS3",
"Secondaire 4 / NS4","Philo"
];
const matieres=[
"Français","Créole haïtien","Mathématiques","Sciences sociales","Histoire",
"Géographie","Sciences expérimentales","SVT","Physique","Chimie",
"Anglais","Espagnol","Éducation physique et sportive",
"Éducation à la citoyenneté","Philosophie","Littérature française",
"Littérature haïtienne"
];
const titres={
niveaux:"Niveaux scolaires",matieres:"Matières",cours:"Cours",
lecons:"Leçons",exercices:"Exercices",examens:"Examens et quiz"
};
const $=id=>document.getElementById(id);
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function msg(t,error=false){
 $("message").textContent=t;
 $("message").style.background=error?"#fadbd8":"#e7f0fa";
 $("message").classList.remove("hidden");
}
function hideMsg(){$("message").classList.add("hidden");}

window.loginGoogle=async()=>{
 $("loginMessage").textContent="";
 try{await signInWithPopup(auth,provider);}
 catch(e){
  try{await signInWithRedirect(auth,provider);}
  catch(err){$("loginMessage").textContent="Connexion impossible : "+err.message;}
 }
};
window.logout=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
 if(!user){
  currentUser=null;currentProfile=null;isAdmin=false;isTeacher=false;
  $("loginPanel").classList.remove("hidden");
  $("app").classList.add("hidden");
  $("headerUser").textContent="";
  return;
 }
 currentUser=user;
 isAdmin=user.uid===ADMIN_UID||(user.email||"").toLowerCase()===ADMIN_EMAIL;
 try{
  const ref=doc(db,"users",user.uid);
  let snap=await getDoc(ref);
  if(!snap.exists()){
   await setDoc(ref,{
    nom:user.displayName||"Utilisateur",email:user.email||"",
    role:isAdmin?"administrateur":"eleve",
    statut:isAdmin?"actif":"attente",createdAt:serverTimestamp()
   });
   snap=await getDoc(ref);
  }
  currentProfile=snap.data();
  if(isAdmin && (currentProfile.role!=="administrateur"||currentProfile.statut!=="actif")){
   await updateDoc(ref,{role:"administrateur",statut:"actif"});
   currentProfile.role="administrateur";currentProfile.statut="actif";
  }
  if(!isAdmin&&currentProfile.statut!=="actif"){
   await signOut(auth);
   $("loginMessage").textContent="Votre compte attend l'approbation de l'administrateur.";
   return;
  }
  isTeacher=isAdmin||currentProfile.role==="professeur";
  $("loginPanel").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("headerUser").textContent=(user.displayName||user.email)+" — "+currentProfile.role;
  $("adminMenu").classList.toggle("hidden",!isAdmin);
  $("teacherMenu").classList.toggle("hidden",!isTeacher);
  await showPage("accueil");
 }catch(e){console.error(e);msg("Erreur de profil : "+e.message,true);}
});

window.showPage=async(page,button)=>{
 hideMsg();
 if(button){
  document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
 }
 const area=$("pageContent");
 if(page==="accueil"){
  area.innerHTML=`
   <h1>Bienvenue sur CONNAISSANCES+</h1>
   <p class="muted">Apprendre, pratiquer et progresser.</p>
   <div class="cards">
    ${Object.entries(titres).map(([k,v])=>`<div class="card"><h3>${safe(v)}</h3><button class="primary" onclick="showPage('${k}')">Explorer</button></div>`).join("")}
    <div class="card"><h3>📊 Résultats</h3><button class="primary" onclick="showPage('resultats')">Consulter</button></div>
    <div class="card"><h3>📈 Progression</h3><button class="primary" onclick="showPage('progression')">Voir</button></div>
   </div>`;
  return;
 }
 if(page==="administration"){
  if(!isAdmin){area.textContent="Accès refusé.";return;}
  await renderAdmin(area);return;
 }
 if(page==="enseignant"){
  if(!isTeacher){area.textContent="Accès refusé.";return;}
  area.innerHTML=`<h1>Espace Enseignant</h1>
   <p>Créez des ressources pour vos élèves. Les nouveaux contenus sont des brouillons.</p>
   <button class="primary" onclick="showPage('cours')">Gérer les cours</button>
   <button class="primary" onclick="showPage('lecons')">Gérer les leçons</button>
   <button class="primary" onclick="showPage('exercices')">Gérer les exercices</button>`;
  return;
 }
 if(page==="resultats"){await renderResults(area);return;}
 if(page==="progression"){await renderProgression(area);return;}
 if(!titres[page]){area.textContent="Page introuvable.";return;}
 await renderCollection(page,area);
};

async function getContentDocs(name){
 let snap;
 if(isAdmin){
  snap=await getDocs(collection(db,name));
  return snap.docs;
 }
 const published=await getDocs(query(collection(db,name),where("publie","==",true)));
 const docs=new Map(published.docs.map(d=>[d.id,d]));
 if(isTeacher){
  const own=await getDocs(query(collection(db,name),where("createdByUid","==",currentUser.uid)));
  own.docs.forEach(d=>docs.set(d.id,d));
 }
 return [...docs.values()];
}

async function renderCollection(name,area){
 area.innerHTML=`<h1>${safe(titres[name])}</h1>
 ${isTeacher?`<button class="primary" onclick="showAddForm('${name}')">＋ Ajouter</button>`:""}
 <div id="addArea"></div><div id="listArea">Chargement...</div>`;
 try{
  const docs=await getContentDocs(name),list=$("listArea");
  if(!docs.length){list.innerHTML="<p class='muted'>Aucun contenu publié pour le moment.</p>";return;}
  list.innerHTML="";
  docs.forEach(d=>{
   const x=d.data(),el=document.createElement("div");
   el.className="item";
   const canEdit=isAdmin||(isTeacher&&x.createdByUid===currentUser.uid);
   el.innerHTML=`<h3>${safe(x.titre||x.nom||"Sans titre")}</h3>
    <p class="muted">${safe(x.niveau||"Tous niveaux")} · ${safe(x.matiere||"Toutes matières")}</p>
    <p>${safe(x.description||x.contenu||"")}</p>
    <span class="badge ${x.publie?"publie":"attente"}">${x.publie?"Publié":"Brouillon"}</span>`;
   if(name==="exercices"||name==="examens"){
    const b=document.createElement("button");b.className="success";
    b.textContent="Commencer";b.onclick=()=>startEvaluation(d.id,x,name);el.appendChild(b);
   }
   if(canEdit){
    const edit=document.createElement("button");edit.className="primary";edit.textContent="Modifier";
    edit.onclick=()=>showAddForm(name,d.id,x);el.appendChild(edit);
   }
   if(isAdmin){
    const pub=document.createElement("button");pub.className="warning";
    pub.textContent=x.publie?"Retirer publication":"Publier";
    pub.onclick=()=>togglePublish(name,d.id,!x.publie);el.appendChild(pub);
    const del=document.createElement("button");del.className="danger";del.textContent="Supprimer";
    del.onclick=()=>removeItem(name,d.id);el.appendChild(del);
   }
   list.appendChild(el);
  });
 }catch(e){$("listArea").textContent="Erreur : "+e.message;}
}

window.showAddForm=(name,id=null,data={})=>{
 if(!isTeacher)return;
 editingId=id;editingCollection=name;
 const questions=Array.isArray(data.questions)?JSON.stringify(data.questions,null,2):"";
 $("addArea").innerHTML=`
 <div class="formbox">
 <h3>${id?"Modifier":"Ajouter"} — ${safe(titres[name])}</h3>
 <label>Titre</label><input id="fTitle" value="${safe(data.titre||"")}" placeholder="Titre du contenu">
 <label>Niveau scolaire</label><select id="fLevel">
 <option value="">Choisir</option>${niveaux.map(n=>`<option ${data.niveau===n?"selected":""}>${safe(n)}</option>`).join("")}</select>
 <label>Matière</label><select id="fSubject"><option value="">Choisir</option>
 ${matieres.map(m=>`<option ${data.matiere===m?"selected":""}>${safe(m)}</option>`).join("")}</select>
 <label>Description / Contenu</label><textarea id="fDescription">${safe(data.description||data.contenu||"")}</textarea>
 <label>Questions QCM (JSON facultatif)</label>
 <textarea id="fQuestions" placeholder='[{"type":"qcm","question":"2 + 2 = ?","options":["2","3","4"],"correctIndex":2,"points":1}]'>${safe(questions)}</textarea>
 <p class="muted">Pou kesyon ouvè, mete type "ouverte", question ak points. Kesyon ouvè mande koreksyon pwofesè.</p>
 <button class="success" onclick="saveItem()">Enregistrer en brouillon</button>
 <button onclick="cancelEdit()">Annuler</button>
 ${isAdmin&&id?`<button class="warning" onclick="togglePublish('${name}','${id}',true)">Publier</button>`:""}
 <button class="primary" onclick="generateAI('${name}')">✨ Préparer avec IA</button>
 </div>`;
};

window.cancelEdit=()=>{$("addArea").innerHTML="";editingId=null;editingCollection=null;};

window.saveItem=async()=>{
 const titre=$("fTitle").value.trim();
 if(!titre){alert("Le titre est obligatoire.");return;}
 let questions=[];
 try{questions=$("fQuestions").value.trim()?JSON.parse($("fQuestions").value):[];}
 catch(e){alert("Le JSON des questions est incorrect.");return;}
 if(!Array.isArray(questions)){alert("Les questions doivent être une liste JSON.");return;}
 const data={
  titre,nom:titre,niveau:$("fLevel").value,matiere:$("fSubject").value,
  description:$("fDescription").value.trim(),
  contenu:$("fDescription").value.trim(),questions,
  updatedAt:serverTimestamp()
 };
 try{
  if(editingId){
   await updateDoc(doc(db,editingCollection,editingId),data);
  }else{
   await addDoc(collection(db,editingCollection),{
    ...data,publie:false,createdAt:serverTimestamp(),
    createdByUid:currentUser.uid,createdByName:currentUser.displayName||currentUser.email
   });
  }
  alert("Contenu enregistré comme brouillon.");
  const n=editingCollection;cancelEdit();await showPage(n);
 }catch(e){alert("Erreur : "+e.message);}
};

window.togglePublish=async(name,id,value)=>{
 if(!isAdmin)return;
 try{await updateDoc(doc(db,name,id),{publie:value,updatedAt:serverTimestamp()});await showPage(name);}
 catch(e){alert("Erreur : "+e.message);}
};
window.removeItem=async(name,id)=>{
 if(!isAdmin||!confirm("Supprimer définitivement ce contenu ?"))return;
 try{await deleteDoc(doc(db,name,id));await showPage(name);}
 catch(e){alert("Erreur : "+e.message);}
};

window.generateAI=async(name)=>{
 if(!isAdmin){alert("La génération IA est réservée à l'administrateur.");return;}
 if(!AI_WORKER_URL.startsWith("https://")){alert("Le Worker IA n'est pas encore configuré.");return;}
 const titre=$("fTitle").value.trim();
 const niveau=$("fLevel").value,matiere=$("fSubject").value;
 if(!niveau||!matiere){alert("Choisissez le niveau et la matière avant la génération.");return;}
 const b=document.querySelector("#addArea button.success");
 if(b){b.disabled=true;b.textContent="Préparation IA...";}
 try{
  const token=await currentUser.getIdToken();
  const response=await fetch(AI_WORKER_URL,{
   method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
   body:JSON.stringify({action:"generate",type:name,titre,niveau,matiere,description:$("fDescription").value})
  });
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||"Erreur IA");
  $("fTitle").value=result.titre||titre||"Contenu proposé par IA";
  $("fDescription").value=result.contenu||result.description||"";
  $("fQuestions").value=JSON.stringify(result.questions||[],null,2);
  alert("Proposition IA reçue. Vérifiez les références MENFP et le contenu avant d'enregistrer.");
 }catch(e){alert("IA indisponible : "+e.message);}
 finally{if(b){b.disabled=false;b.textContent="Enregistrer en brouillon";}}
};

window.startEvaluation=(id,data,type)=>{
 const qs=Array.isArray(data.questions)?data.questions:[];
 if(!qs.length){alert("Cette activité ne contient pas encore de questions structurées.");return;}
 const area=$("pageContent");
 area.innerHTML=`<h2>${safe(data.titre)}</h2><p>${safe(data.description||"")}</p>
 <form id="evaluationForm">
 ${qs.map((q,i)=>`<div class="question"><b>${i+1}. ${safe(q.question||"Question")}</b>
 ${q.type==="qcm"?(q.options||[]).map((o,j)=>`<label style="display:block;font-weight:normal"><input style="width:auto" type="radio" name="q${i}" value="${j}"> ${safe(o)}</label>`).join(""):`<textarea name="q${i}" placeholder="Votre réponse..."></textarea>`}
 </div>`).join("")}
 <button class="success" type="submit">Soumettre</button>
 <button type="button" onclick="showPage('${type}')">Retour</button>
 </form>`;
 $("evaluationForm").onsubmit=e=>submitEvaluation(e,id,data,type);
};

async function submitEvaluation(e,id,data,type){
 e.preventDefault();
 const qs=data.questions||[];
 let score=0,total=0,openCount=0;
 const answers=[];
 qs.forEach((q,i)=>{
  const points=Number(q.points)||1;total+=points;
  if(q.type==="qcm"){
   const selected=document.querySelector(`input[name="q${i}"]:checked`);
   const answer=selected?Number(selected.value):null;
   answers.push({question:q.question,reponse:answer===null?"":(q.options||[])[answer]||"",correct:answer===Number(q.correctIndex),points});
   if(answer===Number(q.correctIndex))score+=points;
  }else{
   const field=document.querySelector(`[name="q${i}"]`);
   answers.push({question:q.question,reponse:field?field.value.trim():"",points,type:"ouverte"});
   openCount++;
  }
 });
 const statut=openCount?"en_attente_correction":"corrige_qcm";
 try{
  await addDoc(collection(db,"resultats"),{
   uid:currentUser.uid,eleveNom:currentUser.displayName||currentUser.email,
   evaluationId:id,type,titre:data.titre||type,answers,
   note:openCount?null:score,sur:total,statut,
   createdAt:serverTimestamp()
  });
  await addDoc(collection(db,"progression"),{
   uid:currentUser.uid,evaluationId:id,type,titre:data.titre||type,
   score:openCount?null:score,sur:total,createdAt:serverTimestamp()
  });
  $("pageContent").innerHTML=`<div class="formbox"><h2>Copie soumise</h2>
  <p>${openCount?"Les réponses ouvertes attendent une correction par l'enseignant.":"Résultat : "+score+" / "+total}</p>
  <button class="primary" onclick="showPage('resultats')">Voir mes résultats</button></div>`;
 }catch(err){alert("Erreur : "+err.message);}
}

async function renderResults(area){
 area.innerHTML="<h1>📊 Résultats</h1><div id='resultsList'>Chargement...</div>";
 try{
  const q=isAdmin?collection(db,"resultats"):query(collection(db,"resultats"),where("uid","==",currentUser.uid));
  const snap=await getDocs(q),list=$("resultsList");
  if(snap.empty){list.textContent="Aucun résultat pour le moment.";return;}
  let html="<div class='table-container'><table><tr><th>Élève</th><th>Évaluation</th><th>Note</th><th>Statut</th></tr>";
  snap.forEach(d=>{
   const r=d.data();
   html+=`<tr><td>${safe(r.eleveNom)}</td><td>${safe(r.titre)}</td>
   <td>${r.note===null||r.note===undefined?"En attente":safe(r.note)+" / "+safe(r.sur)}</td>
   <td>${safe(r.statut)}</td></tr>`;
  });
  list.innerHTML=html+"</table></div>";
 }catch(e){$("resultsList").textContent="Erreur : "+e.message;}
}

async function renderProgression(area){
 area.innerHTML="<h1>📈 Ma progression</h1><div id='progressList'>Chargement...</div>";
 try{
  const snap=await getDocs(query(collection(db,"progression"),where("uid","==",currentUser.uid)));
  $("progressList").innerHTML=snap.empty?"Aucune activité enregistrée.":snap.docs.map(d=>{
   const x=d.data();return `<div class="item"><b>${safe(x.titre)}</b><p>${x.score===null?"Correction en attente":safe(x.score)+" / "+safe(x.sur)}</p></div>`;
  }).join("");
 }catch(e){$("progressList").textContent="Erreur : "+e.message;}
}

async function renderAdmin(area){
 area.innerHTML=`<h1>⚙️ Administration</h1>
 <div class="cards">
 <div class="card"><h3>Utilisateurs</h3><button class="primary" onclick="loadUsers()">Gérer</button></div>
 <div class="card"><h3>Contenus académiques</h3><button class="primary" onclick="showPage('cours')">Gérer les cours</button></div>
 <div class="card"><h3>Exercices et examens</h3><button class="primary" onclick="showPage('exercices')">Gérer</button></div>
 </div><div id="adminContent"></div>`;
}
window.loadUsers=async()=>{
 if(!isAdmin)return;
 const area=$("adminContent");area.textContent="Chargement...";
 try{
  const snap=await getDocs(collection(db,"users"));
  area.innerHTML="<h2>Utilisateurs</h2><div class='table-container'><table><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Statut</th><th>Actions</th></tr>"+
  snap.docs.map(d=>{
   const u=d.data();
   return `<tr><td>${safe(u.nom)}</td><td>${safe(u.email)}</td><td>${safe(u.role)}</td><td>${safe(u.statut)}</td>
   <td><button class="success" onclick="setUser('${d.id}','actif','${u.role||"eleve"}')">Activer</button>
   <button class="primary" onclick="setUser('${d.id}','actif','professeur')">Professeur</button>
   <button class="warning" onclick="setUser('${d.id}','attente','${u.role||"eleve"}')">Suspendre</button></td></tr>`;
  }).join("")+"</table></div>";
 }catch(e){area.textContent="Erreur : "+e.message;}
};
window.setUser=async(uid,statut,role)=>{
 if(!isAdmin||uid===ADMIN_UID){alert("Action non autorisée.");return;}
 try{await updateDoc(doc(db,"users",uid),{statut,role});await loadUsers();}
 catch(e){alert("Erreur : "+e.message);}
};

getRedirectResultSafe();
