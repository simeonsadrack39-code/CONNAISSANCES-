
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123c69">
<title>CONNAISSANCES+</title>

<style>
:root {
  --blue:#123c69;
  --blue2:#1d5d96;
  --light:#f2f6fb;
  --white:#fff;
  --text:#203047;
  --green:#16845b;
  --red:#c0392b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--light);
  color:var(--text);
}
header{
  background:var(--blue);
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}
header h2{margin:0}
button{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
}
.primary{background:var(--blue2);color:white}
.danger{background:var(--red);color:white}
.success{background:var(--green);color:white}
.login{
  max-width:440px;
  margin:70px auto;
  background:white;
  padding:28px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 4px 18px #0001;
}
.login h1{color:var(--blue)}
#app{display:none}
.layout{
  display:flex;
  min-height:calc(100vh - 65px);
}
nav{
  width:230px;
  background:#fff;
  padding:15px;
  border-right:1px solid #ddd;
}
nav button{
  display:block;
  width:100%;
  text-align:left;
  background:white;
  color:var(--text);
  margin:5px 0;
}
nav button:hover,nav button.active{
  background:#e7f0fa;
  color:var(--blue);
}
main{flex:1;padding:22px;min-width:0}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:15px;
}
.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 9px #0000000c;
}
.card h3{margin-top:0;color:var(--blue)}
.card button{margin-top:10px}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #ccd5df;
  border-radius:7px;
  font:inherit;
}
textarea{min-height:110px}
.formbox{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  max-width:700px;
}
.item{
  background:white;
  padding:15px;
  margin:10px 0;
  border-radius:9px;
  border-left:4px solid var(--blue2);
}
.muted{color:#6d7887;font-size:14px}
.hidden{display:none!important}
#message{
  padding:12px;
  border-radius:8px;
  margin:12px 0;
  background:#fff3cd;
  color:#765500;
}
@media(max-width:700px){
  .layout{display:block}
  nav{
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    border-right:0;
    border-bottom:1px solid #ddd;
  }
  nav button{font-size:13px}
  main{padding:14px}
}
</style>
</head>

<body>

<header>
  <h2>📚 CONNAISSANCES+</h2>
  <div id="headerUser"></div>
</header>

<section id="loginPanel" class="login">
  <h1>CONNAISSANCES+</h1>
  <h3>Le savoir ouvre toutes les portes.</h3>
  <p>Votre plateforme éducative haïtienne.</p>
  <p>Connectez-vous pour accéder à votre espace d’apprentissage.</p>
  <button class="primary" onclick="loginGoogle()">
    Continuer avec Google
  </button>
  <div id="loginMessage"></div>
</section>

<section id="app">
  <div class="layout">
    <nav id="menu">
      <button class="active" onclick="showPage('accueil',this)">🏠 Accueil</button>
      <button onclick="showPage('niveaux',this)">🎓 Niveaux scolaires</button>
      <button onclick="showPage('matieres',this)">📘 Matières</button>
      <button onclick="showPage('cours',this)">📚 Cours</button>
      <button onclick="showPage('lecons',this)">📝 Leçons</button>
      <button onclick="showPage('exercices',this)">✍️ Exercices</button>
      <button onclick="showPage('examens',this)">📋 Examens et quiz</button>
      <button onclick="showPage('resultats',this)">📊 Résultats</button>
      <button id="adminMenu" class="hidden" onclick="showPage('administration',this)">⚙️ Administration</button>
      <button onclick="logout()">🚪 Déconnexion</button>
    </nav>

    <main>
      <div id="message" class="hidden"></div>
      <div id="pageContent"></div>
    </main>
  </div>
</section>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getAuth, GoogleAuthProvider, signInWithRedirect,
  getRedirectResult, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
  getFirestore, doc, getDoc, setDoc, addDoc,
  collection, getDocs, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAaF4sq1z27ZscLfMHo5GufkPxnu0-rbnA",
  authDomain: "konesans-plus.firebaseapp.com",
  projectId: "konesans-plus",
  storageBucket: "konesans-plus.firebasestorage.app",
  messagingSenderId: "374720398601",
  appId: "1:374720398601:web:ed9ffff17f25bff5b73fd8"
};

const ADMIN_EMAIL = "simeonsadrack39@gmail.com";

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const provider = new GoogleAuthProvider();

let currentUser = null;
let isAdmin = false;
let currentProfile = null;

const niveauxDefaut = [
"1ère année fondamentale",
"2ème année fondamentale",
"3ème année fondamentale",
"4ème année fondamentale",
"5ème année fondamentale",
"6ème année fondamentale",
"7ème année fondamentale",
"8ème année fondamentale",
"9ème année fondamentale",
"Secondaire 1",
"Secondaire 2",
"Secondaire 3",
"Secondaire 4 / NS4",
"Philo"
];

window.loginGoogle = async function(){
  document.getElementById("loginMessage").textContent =
    "Connexion en cours...";
  try{
    await signInWithRedirect(auth,provider);
  }catch(e){
    document.getElementById("loginMessage").textContent =
      "Erreur de connexion : " + e.message;
  }
};

window.logout = async function(){
  await signOut(auth);
};

function showMessage(msg){
  const el=document.getElementById("message");
  el.textContent=msg;
  el.classList.remove("hidden");
}

function hideMessage(){
  document.getElementById("message").classList.add("hidden");
}

onAuthStateChanged(auth, async user=>{
  if(!user){
    currentUser=null;
    document.getElementById("loginPanel").style.display="block";
    document.getElementById("app").style.display="none";
    document.getElementById("headerUser").textContent="";
    return;
  }

  currentUser=user;
  const email=(user.email||"").toLowerCase();
  isAdmin=email===ADMIN_EMAIL && user.emailVerified===true;

  try{
    if(!isAdmin){
      const profileRef=doc(db,"users",user.uid);
      const profileSnap=await getDoc(profileRef);

      if(!profileSnap.exists()){
        await setDoc(profileRef,{
          nom:user.displayName||"Membre",
          email:user.email,
          role:"membre",
          statut:"attente",
          createdAt:serverTimestamp()
        });
        await signOut(auth);
        document.getElementById("loginMessage").textContent=
          "Votre compte est créé. Il attend l'approbation de l'administrateur.";
        return;
      }

      currentProfile=profileSnap.data();

      if(currentProfile.statut!=="actif"){
        await signOut(auth);
        document.getElementById("loginMessage").textContent=
          "Votre compte est en attente de validation.";
        return;
      }
    }

    document.getElementById("loginPanel").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("headerUser").textContent=
      user.displayName||user.email;

    document.getElementById("adminMenu").classList.toggle("hidden",!isAdmin);

    await showPage("accueil");
  }catch(e){
    console.error(e);
    showMessage("Erreur de chargement : "+e.message);
  }
});

window.showPage = async function(page,button){
  hideMessage();

  document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("active"));
  if(button)button.classList.add("active");

  const area=document.getElementById("pageContent");
  area.innerHTML="<h3>Chargement...</h3>";

  if(page==="accueil"){
    area.innerHTML=`
      <h1>Bienvenue dans CONNAISSANCES+</h1>
      <p>Le savoir ouvre toutes les portes.</p>
      <p>Votre espace d’apprentissage numérique.</p>
      <div class="cards">
        <div class="card"><h3>🎓 Niveaux scolaires</h3><p>De la 1ère année fondamentale à la Philo.</p><button class="primary" onclick="showPage('niveaux')">Explorer</button></div>
        <div class="card"><h3>📘 Matières</h3><p>Découvrez les matières scolaires.</p><button class="primary" onclick="showPage('matieres')">Explorer</button></div>
        <div class="card"><h3>📚 Cours et leçons</h3><p>Consultez les contenus pédagogiques.</p><button class="primary" onclick="showPage('cours')">Explorer</button></div>
        <div class="card"><h3>✍️ Exercices</h3><p>Entraînez-vous et révisez.</p><button class="primary" onclick="showPage('exercices')">Explorer</button></div>
        <div class="card"><h3>📋 Examens et quiz</h3><p>Évaluez vos connaissances.</p><button class="primary" onclick="showPage('examens')">Explorer</button></div>
        <div class="card"><h3>📊 Résultats</h3><p>Retrouvez vos résultats.</p><button class="primary" onclick="showPage('resultats')">Explorer</button></div>
      </div>`;
    return;
  }

  if(page==="administration"){
    if(!isAdmin){area.innerHTML="<p>Accès refusé.</p>";return;}
    await renderAdmin(area);
    return;
  }

  if(page==="resultats"){
    await renderResults(area);
    return;
  }

  await renderCollection(page,area);
};

async function renderCollection(name,area){
  const titles={
    niveaux:"Niveaux scolaires",
    matieres:"Matières",
    cours:"Cours",
    lecons:"Leçons",
    exercices:"Exercices",
    examens:"Examens et quiz"
  };

  const allowed=["niveaux","matieres","cours","lecons","exercices","examens"];
  if(!allowed.includes(name))return;

  let html=`<h1>${titles[name]}</h1>`;
  if(isAdmin){
    html+=`<button class="primary" onclick="showAddForm('${name}')">＋ Ajouter</button>`;
  }
  html+=`<div id="addArea"></div><div id="listArea">Chargement...</div>`;
  area.innerHTML=html;

  try{
    const snap=await getDocs(collection(db,name));
    const list=document.getElementById("listArea");

    if(snap.empty){
      list.innerHTML="<p class='muted'>Aucun contenu publié pour le moment.</p>";
      return;
    }

    list.innerHTML="";
    snap.forEach(d=>{
      const x=d.data();
      const div=document.createElement("div");
      div.className="item";

      const title=document.createElement("h3");
      title.textContent=x.titre||x.nom||"Sans titre";
      div.appendChild(title);

      if(x.niveau)div.appendChild(makeParagraph("Niveau : "+x.niveau));
      if(x.matiere)div.appendChild(makeParagraph("Matière : "+x.matiere));
      if(x.description)div.appendChild(makeParagraph(x.description));
      if(x.contenu)div.appendChild(makeParagraph(x.contenu));

      list.appendChild(div);
    });
  }catch(e){
    document.getElementById("listArea").textContent=
      "Impossible de charger les données : "+e.message;
  }
}

function makeParagraph(text){
  const p=document.createElement("p");
  p.textContent=text;
  return p;
}

window.showAddForm=function(name){
  if(!isAdmin)return;

  const area=document.getElementById("addArea");
  area.innerHTML=`
    <div class="formbox">
      <h3>Ajouter un élément</h3>
      <label>Titre ou nom</label>
      <input id="newTitle" placeholder="Titre">
      <label>Niveau scolaire</label>
      <select id="newLevel">
        <option value="">Choisir un niveau</option>
        ${niveauxDefaut.map(n=>`<option>${n}</option>`).join("")}
      </select>
      <label>Matière</label>
      <input id="newSubject" placeholder="Ex. Mathématiques">
      <label>Description</label>
      <textarea id="newDescription" placeholder="Description ou contenu"></textarea>
      <button class="success" onclick="saveItem('${name}')">Enregistrer</button>
      <button onclick="document.getElementById('addArea').innerHTML=''">Annuler</button>
    </div>`;
};

window.saveItem=async function(name){
  if(!isAdmin)return;

  const titre=document.getElementById("newTitle").value.trim();
  const niveau=document.getElementById("newLevel").value;
  const matiere=document.getElementById("newSubject").value.trim();
  const description=document.getElementById("newDescription").value.trim();

  if(!titre){
    alert("Veuillez saisir un titre.");
    return;
  }

  try{
    await addDoc(collection(db,name),{
      titre,
      nom:titre,
      niveau,
      matiere,
      description,
      contenu:description,
      publie:true,
      createdAt:serverTimestamp(),
      createdBy:currentUser.uid
    });

    alert("Élément enregistré avec succès.");
    await showPage(name);
  }catch(e){
    alert("Erreur : "+e.message);
  }
};

async function renderAdmin(area){
  area.innerHTML=`
    <h1>Administration</h1>
    <p>Gestion de la plateforme CONNAISSANCES+.</p>
    <div class="cards">
      <div class="card"><h3>👥 Utilisateurs</h3><p>Valider les nouveaux comptes.</p><button class="primary" onclick="loadUsers()">Gérer les utilisateurs</button></div>
      <div class="card"><h3>🎓 Niveaux</h3><p>Gérer les niveaux scolaires.</p><button class="primary" onclick="showPage('niveaux')">Gérer</button></div>
      <div class="card"><h3>📚 Contenus</h3><p>Ajouter cours, leçons et exercices.</p><button class="primary" onclick="showPage('cours')">Gérer</button></div>
    </div>
    <div id="usersArea"></div>`;
}

window.loadUsers=async function(){
  if(!isAdmin)return;
  const area=document.getElementById("usersArea");
  area.innerHTML="<h3>Chargement des utilisateurs...</h3>";

  try{
    const snap=await getDocs(collection(db,"users"));
    area.innerHTML="<h2>Utilisateurs</h2>";

    if(snap.empty){
      area.innerHTML+="<p>Aucun utilisateur.</p>";
      return;
    }

    snap.forEach(d=>{
      const u=d.data();
      const div=document.createElement("div");
      div.className="item";

      const name=document.createElement("h3");
      name.textContent=u.nom||"Utilisateur";
      div.appendChild(name);
      div.appendChild(makeParagraph(u.email||""));
      div.appendChild(makeParagraph("Statut : "+(u.statut||"non défini")));

      if(u.statut!=="actif"){
        const btn=document.createElement("button");
        btn.className="success";
        btn.textContent="Activer le compte";
        btn.onclick=()=>approveUser(d.id);
        div.appendChild(btn);
      }

      area.appendChild(div);
    });
  }catch(e){
    area.textContent="Erreur : "+e.message;
  }
};

window.approveUser=async function(uid){
  if(!isAdmin)return;
  try{
    await updateDoc(doc(db,"users",uid),{
      statut:"actif"
    });
    alert("Compte activé.");
    await loadUsers();
  }catch(e){
    alert("Erreur : "+e.message);
  }
};

async function renderResults(area){
  area.innerHTML="<h1>Résultats</h1><p>Chargement...</p>";

  try{
    const snap=await getDocs(collection(db,"resultats"));
    area.innerHTML="<h1>Résultats</h1>";

    let count=0;
    snap.forEach(d=>{
      const r=d.data();
      if(isAdmin || r.uid===currentUser.uid){
        count++;
        const div=document.createElement("div");
        div.className="item";
        div.textContent=
          (r.titre||"Résultat")+" — "+(r.note??"");
        area.appendChild(div);
      }
    });

    if(count===0){
      area.innerHTML+="<p class='muted'>Aucun résultat disponible.</p>";
    }
  }catch(e){
    area.innerHTML="<h1>Résultats</h1><p>Erreur : "+e.message+"</p>";
  }
}

getRedirectResult(auth).catch(e=>{
  document.getElementById("loginMessage").textContent=
    "Erreur de connexion : "+e.message;
});
</script>
</body>
</html>
